# Keep the journal across reboots (from github.com/fabiodj2/rbpi4b
# scripts/device/journald-persistent.conf). On this Orange Pi /var/log/journal
# does not exist, so after a crash or brownout `journalctl -b -1` has nothing.
#
# Install:  sudo install -D -m 0644 journald-persistent.conf \
#               /etc/systemd/journald.conf.d/persistent.conf
#           sudo mkdir -p /var/log/journal && sudo systemctl restart systemd-journald
# Cap sized for an SD card / eMMC.

[Journal]
Storage=persistent
SystemMaxUse=200M
